# Free web server; encrypted records use the quiz-data branch of the same repository.
# Render may still request account/payment verification under its own policies.
services:
  - type: web
    name: quiz2026
    runtime: python
    branch: main
    plan: free
    buildCommand: pip install -r requirements.txt && python3 -m py_compile server.py grading.py github_store.py
    startCommand: python3 server.py
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "1"
      - key: ADMIN_PASSWORD
        sync: false
      - key: GITHUB_DATA_REPO
        value: fung123-ksjeil/quiz2026
      - key: GITHUB_DATA_TOKEN
        sync: false
      - key: QUIZ_DATA_KEY
        generateValue: true
