# Free web server; records are stored in a separate private GitHub repository.
# Render may still request account/payment verification under its own policies.
services:
  - type: web
    name: quiz2026
    runtime: python
    plan: free
    buildCommand: python3 -m py_compile server.py grading.py github_store.py
    startCommand: python3 server.py
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "1"
      - key: ADMIN_PASSWORD
        sync: false
      - key: GITHUB_DATA_REPO
        sync: false
      - key: GITHUB_DATA_TOKEN
        sync: false
